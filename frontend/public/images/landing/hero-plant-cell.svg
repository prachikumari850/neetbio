<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" fill="none">
  <defs>
    <radialGradient id="ambient" cx="0" cy="0" r="1" gradientTransform="matrix(0 390 -390 0 410 380)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fff" stop-opacity=".96"/>
      <stop offset=".55" stop-color="#f5efff" stop-opacity=".8"/>
      <stop offset="1" stop-color="#e9ddff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cytoplasm" cx="0" cy="0" r="1" gradientTransform="matrix(305 210 -207 300 255 258)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f9ffe8"/>
      <stop offset=".54" stop-color="#c7f56a"/>
      <stop offset="1" stop-color="#51bd35"/>
    </radialGradient>
    <linearGradient id="wall" x1="143" x2="558" y1="169" y2="576" gradientUnits="userSpaceOnUse">
      <stop stop-color="#d6ff62"/>
      <stop offset=".42" stop-color="#70d438"/>
      <stop offset="1" stop-color="#229b45"/>
    </linearGradient>
    <linearGradient id="membrane" x1="185" x2="530" y1="205" y2="535" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fbffbb"/>
      <stop offset=".42" stop-color="#a8ed4e"/>
      <stop offset="1" stop-color="#44ba58"/>
    </linearGradient>
    <radialGradient id="nucleus" cx="0" cy="0" r="1" gradientTransform="matrix(126 110 -110 126 322 288)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f4c7ff"/>
      <stop offset=".42" stop-color="#be6bfa"/>
      <stop offset="1" stop-color="#7138cf"/>
    </radialGradient>
    <radialGradient id="vacuole" cx="0" cy="0" r="1" gradientTransform="rotate(55 -90 498) scale(180)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#e2fbff" stop-opacity=".92"/>
      <stop offset=".58" stop-color="#6bd9f5" stop-opacity=".78"/>
      <stop offset="1" stop-color="#38a6df" stop-opacity=".88"/>
    </radialGradient>
    <linearGradient id="chloroplast" x1="0" x2="1" y1="0" y2="1">
      <stop stop-color="#caff68"/>
      <stop offset=".5" stop-color="#56c848"/>
      <stop offset="1" stop-color="#178b53"/>
    </linearGradient>
    <linearGradient id="mitochondrion" x1="0" x2="1" y1="0" y2="1">
      <stop stop-color="#ffd36b"/>
      <stop offset=".5" stop-color="#ff8b35"/>
      <stop offset="1" stop-color="#e34b53"/>
    </linearGradient>
    <linearGradient id="er" x1="0" x2="1" y1="0" y2="1">
      <stop stop-color="#67e4ff"/>
      <stop offset="1" stop-color="#3a8ff2"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" x2="1" y1="0" y2="1">
      <stop stop-color="#d5ff80"/>
      <stop offset=".52" stop-color="#75d852"/>
      <stop offset="1" stop-color="#24a86a"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" x2="1" y1="0" y2="1">
      <stop stop-color="#fff"/>
      <stop offset=".46" stop-color="#c9d4f3"/>
      <stop offset="1" stop-color="#7b69c9"/>
    </linearGradient>
    <filter id="softShadow" width="1.5" height="1.5" x="-.25" y="-.2" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="14"/>
      <feOffset dy="18"/>
      <feColorMatrix values="0 0 0 0 .25 0 0 0 0 .15 0 0 0 0 .5 0 0 0 .25 0"/>
      <feBlend in2="SourceGraphic"/>
      <feComposite in2="SourceAlpha" operator="in"/>
    </filter>
    <filter id="glow" width="1.8" height="1.8" x="-.4" y="-.4" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <filter id="smallShadow" width="1.4" height="1.5" x="-.2" y="-.2" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5"/>
      <feOffset dy="7"/>
      <feComponentTransfer><feFuncA slope=".18" type="linear"/></feComponentTransfer>
      <feBlend in2="SourceGraphic"/>
      <feComposite in2="SourceAlpha" operator="in"/>
    </filter>
    <g id="leaflet">
      <path d="M0 70C5 26 37 2 76 0 75 40 48 72 0 70Z" fill="url(#leaf)"/>
      <path d="M5 67 65 12M24 50l-5-23m22 4 1-18m-9 42 20-2" stroke="#efffc0" stroke-linecap="round" stroke-width="2.5" opacity=".78"/>
    </g>
    <g id="mito">
      <path d="M5 30C10 10 37 1 59 9c20 7 29 24 20 39-10 17-39 23-61 14C2 55-1 43 5 30Z" fill="url(#mitochondrion)" stroke="#ffcf77" stroke-width="3"/>
      <path d="M15 42c5-17 13-17 18 0s13 17 18 0 12-17 17 0" stroke="#fff2b5" stroke-linecap="round" stroke-width="4"/>
      <path d="M17 26c4-8 11-12 19-13" stroke="#fff" stroke-linecap="round" stroke-width="3" opacity=".7"/>
    </g>
    <g id="chloro">
      <ellipse cx="48" cy="25" rx="47" ry="24" fill="url(#chloroplast)" stroke="#e5ff96" stroke-width="3"/>
      <path d="M18 15h60M13 23h70M18 31h60M27 39h43" stroke="#e9ffad" stroke-linecap="round" stroke-width="4" opacity=".88"/>
      <path d="M31 11v28m22-29v31m19-28v25" stroke="#26984a" stroke-linecap="round" stroke-width="2" opacity=".65"/>
    </g>
  </defs>

  <circle cx="403" cy="388" r="385" fill="url(#ambient)"/>
  <circle cx="375" cy="380" r="246" fill="#a781ff" opacity=".18" filter="url(#glow)"/>

  <!-- DNA helix floating behind the cell -->
  <g opacity=".76" stroke-linecap="round">
    <path d="M139 105c95 35 95 93 0 132s-95 97 0 136 95 97 0 136" stroke="#9663ed" stroke-width="13"/>
    <path d="M230 105c-95 35-95 93 0 132s95 97 0 136-95 97 0 136" stroke="#35bce7" stroke-width="13"/>
    <path d="m155 114 59 0m-33 25 57 0m-83 28 68 0m-73 30 51 0m-56 31 43 0m-42 29 41 0m-50 30 57 0m-47 31 66 0m-35 31 56 0m-71 31 57 0m-55 31 42 0m-28 32 54 0m-54 31 68 0" stroke="#fff" stroke-width="5" opacity=".9"/>
  </g>

  <!-- Soft botanical framing -->
  <g opacity=".94">
    <path d="M42 710c60-48 111-95 157-161" stroke="#4cb96a" stroke-linecap="round" stroke-width="6"/>
    <use href="#leaflet" transform="translate(28 642) rotate(-42) scale(1.08)"/>
    <use href="#leaflet" transform="translate(95 594) rotate(2) scale(.9)"/>
    <use href="#leaflet" transform="translate(58 692) rotate(-92) scale(.72)"/>
    <path d="M614 182c44-48 82-98 112-155" stroke="#4cb96a" stroke-linecap="round" stroke-width="5"/>
    <use href="#leaflet" transform="translate(654 113) rotate(-56) scale(.87)"/>
    <use href="#leaflet" transform="translate(693 55) rotate(8) scale(.7)"/>
    <use href="#leaflet" transform="translate(614 155) rotate(-132) scale(.65)"/>
  </g>

  <!-- Cell cast shadow and dimensional cell wall -->
  <path d="M352 148c38-25 82-10 101 22 44-12 79 19 76 59 38 26 44 69 18 101 18 42-5 81-47 89-13 43-54 60-92 39-35 26-79 12-94-25-46 4-75-29-64-69-33-34-25-78 13-100-7-42 21-73 63-70 4-22 14-37 26-46Z" fill="#4e2ca5" opacity=".3" filter="url(#glow)" transform="translate(7 26)"/>
  <g filter="url(#softShadow)">
    <path d="M352 148c38-25 82-10 101 22 44-12 79 19 76 59 38 26 44 69 18 101 18 42-5 81-47 89-13 43-54 60-92 39-35 26-79 12-94-25-46 4-75-29-64-69-33-34-25-78 13-100-7-42 21-73 63-70 4-22 14-37 26-46Z" fill="url(#wall)" stroke="#f0ff9b" stroke-width="8"/>
    <path d="M357 164c32-20 67-8 83 21 39-9 66 17 61 51 33 23 37 58 14 84 15 35-5 66-41 72-12 36-46 49-78 31-30 22-66 10-79-21-39 3-63-24-54-58-28-29-21-65 11-84-6-35 18-61 53-59 4-17 13-29 30-37Z" fill="url(#membrane)" stroke="#74ca40" stroke-width="5"/>
    <path d="M367 179c26-16 55-7 69 17 32-7 55 14 50 43 27 19 31 48 12 69 13 29-4 55-34 60-10 30-38 41-65 26-25 18-55 8-66-17-32 3-52-20-45-48-23-24-17-54 9-70-5-29 15-51 44-49 3-14 11-24 26-31Z" fill="url(#cytoplasm)" opacity=".9"/>
  </g>

  <!-- Endoplasmic reticulum ribbons -->
  <g stroke="url(#er)" stroke-linecap="round" stroke-width="13" opacity=".98">
    <path d="M268 243c-38-20-53 8-30 25 20 15 55-8 70 9 17 20-20 35-8 53 15 23 47-2 61 17"/>
    <path d="M262 270c-30-4-39 22-17 31 20 8 44-9 55 7 12 18-13 27-2 41 11 15 34 2 45 17"/>
    <path d="M362 223c32-26 58-10 43 9-14 17-47 10-48 29-1 19 37 22 29 41-8 19-40 12-43 31"/>
    <path d="M375 365c29-19 51-2 34 13-16 15-42 3-48 20-7 18 26 29 13 43-12 13-35-3-48 10"/>
  </g>
  <g fill="#e9ffff" opacity=".9">
    <circle cx="270" cy="246" r="3.2"/><circle cx="308" cy="268" r="3.2"/><circle cx="297" cy="327" r="3.2"/><circle cx="366" cy="244" r="3.2"/><circle cx="390" cy="297" r="3.2"/><circle cx="361" cy="394" r="3.2"/><circle cx="330" cy="434" r="3.2"/>
  </g>

  <!-- Central vacuole -->
  <path d="M375 329c23-29 69-34 95-9 20 19 19 54-1 78-23 28-63 35-88 18-26-18-29-60-6-87Z" fill="url(#vacuole)" stroke="#e2fdff" stroke-width="5" filter="url(#smallShadow)"/>
  <path d="M390 345c14-16 36-23 54-17" stroke="#fff" stroke-linecap="round" stroke-width="8" opacity=".74"/>

  <!-- Purple nucleus with nucleolus -->
  <circle cx="342" cy="325" r="73" fill="#6031bd" opacity=".24" filter="url(#glow)"/>
  <circle cx="340" cy="318" r="64" fill="url(#nucleus)" stroke="#f4d5ff" stroke-width="5" filter="url(#smallShadow)"/>
  <circle cx="358" cy="333" r="23" fill="#6b35c8" opacity=".76"/>
  <circle cx="355" cy="330" r="12" fill="#eaa4ff" opacity=".86"/>
  <path d="M302 296c12-20 32-30 53-28" stroke="#fff" stroke-linecap="round" stroke-width="8" opacity=".68"/>

  <!-- Chloroplasts -->
  <use href="#chloro" transform="translate(235 194) rotate(-22 48 25) scale(.88)" filter="url(#smallShadow)"/>
  <use href="#chloro" transform="translate(405 215) rotate(24 48 25) scale(.78)" filter="url(#smallShadow)"/>
  <use href="#chloro" transform="translate(217 412) rotate(24 48 25) scale(.82)" filter="url(#smallShadow)"/>

  <!-- Mitochondria -->
  <use href="#mito" transform="translate(260 344) rotate(-32 42 34) scale(.78)" filter="url(#smallShadow)"/>
  <use href="#mito" transform="translate(416 380) rotate(21 42 34) scale(.74)" filter="url(#smallShadow)"/>
  <use href="#mito" transform="translate(332 453) rotate(-11 42 34) scale(.66)" filter="url(#smallShadow)"/>

  <!-- Golgi stacks and small vesicles -->
  <g filter="url(#smallShadow)" stroke-linecap="round">
    <path d="M442 286c20-13 39-13 55-5M439 297c20-11 42-10 58-1M436 309c20-9 42-8 58 2M436 321c19-6 38-3 52 7" stroke="#ec74c6" stroke-width="9"/>
    <circle cx="490" cy="269" r="6" fill="#ffae70"/><circle cx="505" cy="341" r="7" fill="#ff8b60"/><circle cx="425" cy="280" r="5" fill="#f68cd0"/>
  </g>

  <!-- Ribosomes and floating particles -->
  <g fill="#fff" opacity=".95">
    <circle cx="302" cy="222" r="3"/><circle cx="390" cy="191" r="3.5"/><circle cx="477" cy="240" r="3"/><circle cx="468" cy="357" r="3.5"/><circle cx="285" cy="389" r="3"/><circle cx="390" cy="434" r="3.5"/><circle cx="250" cy="310" r="2.5"/><circle cx="440" cy="415" r="2.5"/>
    <circle cx="84" cy="282" r="4"/><circle cx="584" cy="202" r="4"/><circle cx="623" cy="419" r="3"/><circle cx="166" cy="525" r="3.5"/><circle cx="574" cy="531" r="4"/>
  </g>
  <g fill="#ffb54b">
    <path d="m590 303 5 14 14 5-14 5-5 14-5-14-14-5 14-5 5-14Z"/>
    <path d="m166 188 3 9 9 3-9 3-3 9-3-9-9-3 9-3 3-9Z" opacity=".88"/>
  </g>

  <!-- Compact microscope supporting the biology-learning theme -->
  <g transform="translate(613 564)" filter="url(#smallShadow)">
    <ellipse cx="91" cy="158" rx="93" ry="18" fill="#8c75d2" opacity=".18"/>
    <path d="M25 151h135c8 0 14 6 14 13v4H11v-4c0-7 6-13 14-13Z" fill="url(#metal)" stroke="#8f7bd5" stroke-width="3"/>
    <path d="M62 145c4-42 22-67 54-82l15 19c-25 13-34 34-36 63H62Z" fill="#7561cf" stroke="#d8d0ff" stroke-width="4"/>
    <path d="m97 67 22-15 43 48-18 17-47-50Z" fill="url(#metal)" stroke="#8b75d1" stroke-width="4"/>
    <path d="m149 113 26 25-11 12-30-20 15-17Z" fill="#f97316" stroke="#ffd1a3" stroke-width="4"/>
    <path d="M55 129h37v10H55z" rx="4" fill="#34b9e6"/>
    <path d="M44 96c-14 23-14 44 3 55" stroke="#8c77df" stroke-width="11" stroke-linecap="round"/>
    <circle cx="45" cy="105" r="8" fill="#ffb44b" stroke="#fff" stroke-width="3"/>
    <path d="M77 84c-4-18 0-34 15-46" stroke="#a993f2" stroke-width="7" stroke-linecap="round"/>
    <path d="M81 151v-22" stroke="#5942aa" stroke-width="7" stroke-linecap="round"/>
    <path d="M108 25 91 9l-11 11 18 18" fill="#342274" stroke="#c9bdff" stroke-width="4"/>
  </g>
</svg>
